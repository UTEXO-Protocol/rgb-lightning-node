name: Run tests

on:
  push:
    branches: [ "master", "dev", "stage" ]
  pull_request:
    branches: [ "master", "dev", "stage" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: warp-ubuntu-latest-x64-16x
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Tests
        run: cargo test -- --test-threads=1
      - name: UniFFI SDK smoke tests
        run: cargo test --features uniffi --lib 'uniffi_smoke_tests::' -- --test-threads=1

  parity-tests:
    runs-on: warp-ubuntu-latest-x64-16x
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test_name: [zero_amount_invoice, send_receive]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Run parity test by name
        run: cargo test ${{ matrix.test_name }} -- --test-threads=1

  wasm-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: wasm-sdk check
        run: cargo check --manifest-path bindings/wasm-sdk/Cargo.toml
      - name: wasm-sdk test (compile only)
        run: cargo test --manifest-path bindings/wasm-sdk/Cargo.toml --no-run

  wasm-sdk-wasm32:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: wasm-sdk wasm32 check
        run: cargo check --manifest-path bindings/wasm-sdk/Cargo.toml --target wasm32-unknown-unknown

  wasm-sdk-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WASM_PACK_VERSION: "0.13.1"
      WASM_BINDGEN_TEST_TIMEOUT: "300"
      WASM_BROWSER_TEST_LOG: "bindings/wasm-sdk/target/wasm-browser-tests-chrome.log"
      WASM_BINDGEN_TEST_RUNNER_VERSION: "0.2.117"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version ${WASM_PACK_VERSION} --locked
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Browser tooling versions
        run: |
          wasm-pack --version
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          elif command -v chromium-browser >/dev/null 2>&1; then
            chromium-browser --version
          else
            echo "Chrome/Chromium binary not found in PATH"
            exit 1
          fi
      - name: wasm-sdk browser tests
        run: |
          WASM_TEST_BROWSER=chrome ./bindings/wasm-sdk/scripts/run-browser-tests.sh
      - name: Verify wasm-bindgen test runner version
        if: always()
        run: |
          RUNNER_PATH="$(find "${HOME}/.cache/.wasm-pack" -maxdepth 2 -type f -name "wasm-bindgen-test-runner" | head -n1 || true)"
          if [ -z "${RUNNER_PATH}" ]; then
            echo "wasm-bindgen-test-runner binary was not found in cache"
            exit 1
          fi
          RAW_VERSION="$(${RUNNER_PATH} --version)"
          echo "Runner path: ${RUNNER_PATH}"
          echo "Runner version: ${RAW_VERSION}"
          ACTUAL_VERSION="$(printf '%s\n' "${RAW_VERSION}" | awk '{print $2}')"
          if [ "${ACTUAL_VERSION}" != "${WASM_BINDGEN_TEST_RUNNER_VERSION}" ]; then
            echo "Unexpected wasm-bindgen-test-runner version: ${ACTUAL_VERSION} (expected ${WASM_BINDGEN_TEST_RUNNER_VERSION})"
            exit 1
          fi
      - name: Cached wasm runner versions
        if: always()
        run: |
          find "${HOME}/.cache/.wasm-pack" -maxdepth 2 -type f -name "wasm-bindgen-test-runner" -print -exec {} --version \; || true
          find "${HOME}/.cache/.wasm-pack" -maxdepth 3 -type f -name "chromedriver" -print -exec {} --version \; || true
      - name: Upload browser test artifacts (chrome)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-sdk-browser-chrome-logs
          path: |
            bindings/wasm-sdk/target/wasm-browser-tests-chrome.log
            bindings/wasm-sdk/target/wasm32-unknown-unknown/debug/deps/*.wasm
          if-no-files-found: warn

  lib-sdk-tests:
    runs-on: warp-ubuntu-latest-x64-16x
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Start regtest services
        run: ./regtest.sh start
      - name: Run lib_sdk tests
        # Temporarily excluded from blocking CI until the persistence-related fix lands in dev:
        # - payment::success
        # - send_receive::send_receive
        # Re-enable after PR #15 is merged into dev.
        run: cargo test --features uniffi --test lib_sdk -- --test-threads=1 --skip payment::success --skip send_receive::send_receive
      - name: Stop regtest services
        if: always()
        run: ./regtest.sh stop
