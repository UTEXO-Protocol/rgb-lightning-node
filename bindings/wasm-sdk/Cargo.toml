[package]
name = "rln-wasm-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
description = "Standalone WASM SDK bridge for RLN + rgb-lib-wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
debug-manual-events = []

[dependencies]
rgb-lib-wasm = { path = "../../../rgb-lib-wasm", package = "rgb-lib-wasm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures = "0.3"
hex = "0.4"
gloo-net = { version = "0.5", features = ["websocket"] }
web-sys = { version = "0.3", features = ["console", "Window", "Storage"] }
lightning-invoice = { version = "0.34.0", features = ["std"] }
bitcoin_hashes = "0.14"
secp256k1 = "0.29"

[profile.reldebug]
inherits = "release"
debug = 1

[dev-dependencies]
wasm-bindgen-test = "0.3"

[patch.crates-io]
rgb-strict-encoding = { path = "vendor/rgb-strict-encoding/rust" }
rgb-strict-encoding-derive = { path = "vendor/rgb-strict-encoding/rust/derive" }
rgb-consensus = { path = "vendor/rgb-consensus" }
rgb-ops = { path = "vendor/rgb-ops" }
rgb-invoicing = { path = "vendor/rgb-ops/invoice" }
