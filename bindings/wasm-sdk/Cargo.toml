[package]
name = "rln-wasm-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
description = "Standalone WASM SDK bridge for RLN + rgb-lib-wasm"

[lib]
crate-type = ["cdylib", "rlib"]

# The crate targets wasm32 only and always builds against the real `rgb-lib-wasm` backend, so the
# backend feature is enabled by default (wasm-pack and `cargo build --target wasm32` use defaults).
[features]
default = ["real-wasm-rgb"]
debug-manual-events = []
real-wasm-rgb = ["lightning/rgb-wasm"]
# Tests that require live RGB/LN infra (online wallet via a real indexer): excluded from the
# infra-less headless-browser job; enable in an infra-backed job.
wasm-browser-infra = []

[dependencies]
rgb-lib-wasm = { git = "https://github.com/UTEXO-Protocol/rgb-lib-wasm.git", branch = "dev", package = "rgb-lib-wasm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures = "0.3"
base64 = "0.22"
bincode = "1.3"
hex = "0.4"
gloo-net = { version = "0.5", features = ["websocket", "http"] }
web-sys = { version = "0.3", features = ["console", "Window", "Storage"] }
lightning-invoice = { version = "0.34.0", features = ["std"] }
bitcoin_hashes = "0.14"
secp256k1 = "0.29"
urlencoding = "2.1"
# Core RLN is reverted to dev (native, pre-wasm rust-lightning), so the wasm SDK pulls the
# wasm-compatibility rust-lightning + shared contracts from git instead of the local tree:
#   - lightning: pinned to the rust-lightning commit the feat/wasm-version SDK targets (RgbBackend +
#     9-arg create_channel).
#   - sdk-contracts: from the rgb-lightning-node feat/wasm-version fork.
lightning = { git = "https://github.com/UTEXO-Protocol/rust-lightning.git", rev = "3313e10d9291838c4ad2d9528f79b7dffbc63488", default-features = false, features = ["std"] }
sdk-contracts = { git = "https://github.com/rmn-boiko/rgb-lightning-node.git", branch = "feat/wasm-version" }

[patch.crates-io]
lightning-invoice = { git = "https://github.com/UTEXO-Protocol/rust-lightning.git", rev = "3313e10d9291838c4ad2d9528f79b7dffbc63488" }

[profile.reldebug]
inherits = "release"
debug = 1

[dev-dependencies]
wasm-bindgen-test = "0.3"

[workspace]
