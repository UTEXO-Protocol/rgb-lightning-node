[package]
name = "wasm-proxy-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"

[features]
# Dev-only HTTP endpoints used by demos/E2E:
# - /dev/regular-rln/*
# - /dev/regtest/*
dev-http = []

[dependencies]
anyhow = "1.0.93"
axum = { version = "0.7.7", features = ["ws"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "net", "time"] }
tower-http = { version = "0.6.1", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
bitcoin = "0.30"
