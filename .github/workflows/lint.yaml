name: Lint code

on:
  push:
    branches: [ "master", "stage", "dev" ]
  pull_request:
    branches: [ "master", "stage", "dev" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/git-credentials
        with:
          token: ${{ secrets.ORG_READ_TOKEN }}
          rgb-lib-token: ${{ secrets.BFA_READ_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
