name: Run tests

on:
  push:
    branches: [ "master", "dev", "stage" ]
  pull_request:
    branches: [ "master", "dev", "stage" ]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

# Draft scope: runs only the funding-crash test, which passes here because the
# funding-recovery fix is present (it is red on dev without it). The full job
# matrix returns before this PR leaves draft.
jobs:
  funding-crash-gap-test:
    runs-on: warp-ubuntu-latest-x64-16x
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Build daemon binary (spawned as a subprocess by the test)
        run: cargo build
      - name: Start regtest services
        run: ./regtest.sh start
      - name: Run funding-crash gap test
        run: SKIP_INIT=1 cargo test --bin rgb-lightning-node funding_crash_sender -- --test-threads=1 --nocapture
      - name: Stop regtest services
        if: always()
        run: ./regtest.sh stop
