name: WASM Artifacts

on:
  push:
    branches: [ "master", "dev", "stage" ]
  pull_request:
    branches: [ "master", "dev", "stage" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm-sdk-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/git-credentials
        with:
          token: ${{ secrets.ORG_READ_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Test browser SDK
        working-directory: bindings/wasm-sdk
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 120
        run: |
          wasm-pack test --headless --chrome --chromedriver "$(command -v chromedriver)" --locked
      - name: Build wasm-sdk package (web target)
        run: |
          cd bindings/wasm-sdk
          wasm-pack build --target web --release --out-dir pkg
      - name: Upload wasm-sdk pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: rln-wasm-sdk-pkg
          path: bindings/wasm-sdk/pkg
          if-no-files-found: error
