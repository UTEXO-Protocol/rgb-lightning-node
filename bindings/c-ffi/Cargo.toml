[package]
name = "rln-c-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
build = "build.rs"
publish = false

[lib]
# staticlib: mobile + napi link against librlncffi.a. rlib: Rust consumers
# (e.g. the napi-rs binding) call wrappers without redeclaring the extern "C".
crate-type = ["staticlib", "rlib"]
name = "rlncffi"

[dependencies]
rgb-lightning-node = { path = "../..", features = ["uniffi", "vls", "vss"] }
# Direct deps so we can construct typed wrappers by their real crate paths —
# `rgb_lightning_node::PaymentHash` etc. are aliases and Rust 2021 doesn't
# allow tuple-struct construction through an alias. Unified with the parent
# via `[patch.crates-io]` below.
lightning = { version = "0.2.0" }
lightning-invoice = { version = "0.34.0", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
hex = { package = "hex-conservative", version = "0.3.0" }

[build-dependencies]
cbindgen = "0.29.0"

[features]
default = []

# Own workspace so the parent crate's rust-lightning path-submodule workspace
# isn't pulled in. The committed Cargo.lock locks `rgb-lib` to the same
# revision the parent uses.
[workspace]

# Mirror the parent's [patch.crates-io] so we don't end up with two copies of
# `lightning` (which fails with trait-bound errors). Keep in lock-step with
# the parent's pins.
#
# IMPORTANT: `lightning` MUST resolve to the SAME rust-lightning the parent
# builds — the pinned submodule at `../../rust-lightning`. The parent crate's
# v0.5.2 source uses fork-specific APIs (e.g. `RgbInfo.batch_transfer_idx`)
# that only exist at the submodule commit; pointing these at a separate
# `rmn-boiko` branch tip drifts behind and fails to compile the parent
# source. Using the submodule path guarantees they never skew again.
[patch.crates-io]
rgb-consensus = { git = "https://github.com/UTEXO-Protocol/rgb-consensus-s-bfa.git", rev = "af0b751dc9e51547cd57e025fdc3508e120ddf8a" }
rgb-ops = { git = "https://github.com/UTEXO-Protocol/rgb-ops-s-bfa.git", rev = "ed1d60df69f9e4db65640c0ac61a5779ba9c018c" }
rgb-invoicing = { git = "https://github.com/UTEXO-Protocol/rgb-ops-s-bfa.git", rev = "ed1d60df69f9e4db65640c0ac61a5779ba9c018c" }
rgb-psbt-utils = { git = "https://github.com/UTEXO-Protocol/rgb-api-s-bfa.git", rev = "8e2f515d0f6445e88d3c794a4b592f7bdd3a12df" }
rgb-schemas = { git = "https://github.com/UTEXO-Protocol/rgb-schemas-s-bfa.git", rev = "641a06f31cd277c42222504c8040055c8cbafca5" }
rgb-strict-encoding = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "e12b9944b30171950de03778d6666b24bc33d994" }
rgb-strict-encoding-derive = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "e12b9944b30171950de03778d6666b24bc33d994" }
rgb-strict-types = { git = "https://github.com/rgb-protocol/rgb-strict-types", rev = "8714cdcc8af25333c27214cdf9f42a6388d484ff" }

lightning = { path = "../../rust-lightning/lightning" }
lightning-background-processor = { path = "../../rust-lightning/lightning-background-processor" }
lightning-block-sync = { path = "../../rust-lightning/lightning-block-sync" }
lightning-dns-resolver = { path = "../../rust-lightning/lightning-dns-resolver" }
lightning-invoice = { path = "../../rust-lightning/lightning-invoice" }
lightning-net-tokio = { path = "../../rust-lightning/lightning-net-tokio" }
lightning-persister = { path = "../../rust-lightning/lightning-persister" }
lightning-rapid-gossip-sync = { path = "../../rust-lightning/lightning-rapid-gossip-sync" }
lightning-transaction-sync = { path = "../../rust-lightning/lightning-transaction-sync" }
vls-core = { git = "https://github.com/UTEXO-Protocol/vls-core.git", rev = "45c72edfd58620849eb486925439a76526b415ae" }
vls-protocol-signer = { git = "https://github.com/UTEXO-Protocol/vls-protocol-signer.git", rev = "dddd336fcdf84c4febdd7af8363bda8d1721d893" }
