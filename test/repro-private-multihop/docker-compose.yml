services:
  bitcoind:
    image: registry.gitlab.com/hashbeam/docker/bitcoind:30.2
    container_name: bitcoind
    command: ["-fallbackfee=0.0002", "-rest"]
    environment:
      MYUID: ${MYUID:-1000}
      MYGID: ${MYGID:-1000}
      RPCAUTH: ${RPCAUTH:-user:84c66d54d736d8b02aaa5b02e07e759b$$cc56c229b2a49ae2bfd5932cc8a6135d435bb9a7ac037ddd351d65936082c03d}
    ports:
      - 18443:18443
    volumes:
      - ./data/bitcoind:/srv/app/.bitcoin

  electrs:
    image: registry.gitlab.com/hashbeam/docker/electrs:0.11.0
    container_name: electrs
    environment:
      MYUID: 1000
      MYGID: 1000
      BTCPASS: "password"
    volumes:
      - ./data/electrs:/srv/app/db
    depends_on:
      - bitcoind
    ports:
      - 50001:50001

  esplora:
    image: mempool/electrs:v3.2.0
    container_name: esplora
    command:
      - --jsonrpc-import
      - --cookie=user:password
      - --network=regtest
      - --daemon-rpc-addr=bitcoind:18443
      - --http-addr=0.0.0.0:3002
    depends_on:
      - bitcoind
    ports:
      - 3002:3002

  proxy:
    image: ghcr.io/rgb-tools/rgb-proxy-server:0.3.0
    container_name: proxy
    ports:
      - 3000:3000

  node-a:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: node-a
    depends_on:
      - bitcoind
      - esplora
      - proxy
    ports:
      - "3611:3000"
    volumes:
      - ./data/nodeA:/var/lib/rln
    entrypoint: /usr/bin/rgb-lightning-node
    command:
      - /var/lib/rln
      - --daemon-listening-port
      - "3000"
      - --ldk-peer-listening-port
      - "9735"
      - --network
      - regtest
      - --disable-authentication

  node-b:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: node-b
    depends_on:
      - bitcoind
      - esplora
      - proxy
    ports:
      - "3612:3000"
    volumes:
      - ./data/nodeB:/var/lib/rln
    entrypoint: /usr/bin/rgb-lightning-node
    command:
      - /var/lib/rln
      - --daemon-listening-port
      - "3000"
      - --ldk-peer-listening-port
      - "9736"
      - --network
      - regtest
      - --disable-authentication

  node-c:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: node-c
    depends_on:
      - bitcoind
      - esplora
      - proxy
    ports:
      - "3613:3000"
    volumes:
      - ./data/nodeC:/var/lib/rln
    entrypoint: /usr/bin/rgb-lightning-node
    command:
      - /var/lib/rln
      - --daemon-listening-port
      - "3000"
      - --ldk-peer-listening-port
      - "9737"
      - --network
      - regtest
      - --disable-authentication

