name: Run tests

on:
  push:
    branches: [ "master", "dev", "stage" ]
  pull_request:
    branches: [ "master", "dev", "stage" ]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

# Draft scope: only the device-loss durability gap test runs, and it is
# expected to fail until the gap is fixed. The full job matrix returns before
# this PR leaves draft.
jobs:
  vss-device-loss-gap-test:
    runs-on: warp-ubuntu-latest-x64-16x
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Start VSS services
        run: docker compose --profile vss up -d --wait
      - name: Wait for VSS server
        run: timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/8081) 2>/dev/null; do sleep 2; done'
      - name: Run device-loss durability gap test
        run: cargo test --features vss "test::vss_device_loss_gap" -- --test-threads=1
      - name: Stop VSS services
        if: always()
        run: docker compose --profile vss down -v --remove-orphans
